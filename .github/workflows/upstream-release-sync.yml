name: Upstream release sync

# Opens a pull request that merges each new upstream EmDash release (an emdash@X.Y.Z tag) into main.
# See .github/scripts/upstream-release-sync.sh.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync, such as emdash@1.7.0 (default: the newest stable release)"
        required: false

permissions:
  contents: read

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'machanigroup/emdash'
    runs-on: ubuntu-latest
    steps:
      # The default token can't push workflow files, which releases often change, can't open pull requests in this
      # repository, and its pull requests wouldn't start CI. UPSTREAM_SYNC_TOKEN is a fine-grained token for this
      # repository with Contents, Pull requests and Workflows set to read and write.
      - name: Check the sync token
        env:
          TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the UPSTREAM_SYNC_TOKEN secret (Contents, Pull requests and Workflows: read and write)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Merge the release into a pull request
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          TAG: ${{ inputs.tag }}
          EXTRACT_CATALOGS: pnpm locale:extract
        run: |
          git config user.name "machanigroup-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/upstream-release-sync.sh "$TAG"
